name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USERNAME}}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/projects/poonhill/backend
            git pull origin main  # Pull latest changes
            npm ci  # Install dependencies (if needed)
            npm run build  # Build project (if applicable)
            npm run migration:run  # Apply TypeORM migrations (baseline is no-op; future DDL only)
            pm2 restart api.poonhill  # Restart the app if using PM2
